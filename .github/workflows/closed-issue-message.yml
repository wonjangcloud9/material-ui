name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@50c1bc6ecbf46516cafe4085d172fa8753c83bd0 # master
    permissions:
      contents: read
      issues: write
